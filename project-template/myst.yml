# ─────────────────────────────────────────────────────────────────────
# CUNY Experiential Learning Repository — project configuration
#
# Replace every value marked REPLACE. Leave the `site:` block as it is:
# those settings define the shared look and feel across all projects in
# the repository.
# ─────────────────────────────────────────────────────────────────────
version: 1
extends: []

project:
  # Short, lowercase, hyphenated. Must be unique in the repository.
  id: REPLACE-project-id

  title: "REPLACE — Project Title"
  subtitle: "REPLACE — Course number and short descriptor"

  description: >
    REPLACE — Two or three sentences describing the project, what
    students do, and what they learn. This text is what appears in
    repository search results, so write it for a colleague deciding
    whether the project fits their course.

  authors:
    - name: "REPLACE — Full Name, Credentials"
      email: "REPLACE@cuny.edu"
      affiliation: "REPLACE — College, CUNY"

  # Used for discovery and filtering. Include discipline, course level,
  # and distinguishing features (field visit, dataset, simulation).
  keywords:
    - experiential learning
    - REPLACE — discipline
    - REPLACE — course level
    - REPLACE — format

  bibliography:
    - references.bib

  toc:
    - file: index.md
    - file: chapters/01-introduction.md
    - file: chapters/02-overview-and-objectives.md
    # Add one entry per chapter, in reading order.

# ─── House style — do not modify ─────────────────────────────────────
site:
  template: book-theme
  options:
    logo_text: "CUNY Experiential Learning Repository"
    hide_outline: true
