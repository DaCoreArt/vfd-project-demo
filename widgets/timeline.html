<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Department founding timeline</title>
<style>
  :root {
    --ink: #16191d;
    --paper: #f7f5f2;
    --steel: #6b7280;
    --ember: #c8322b;
    --rule: #dcd7cf;
    --active: #1f4b3f;
    /* Room for centered logo + multi-word labels at 1905 / 1928. */
    --edge-pad: 56px;
    --marker-w: 96px;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.4;
    padding: 10px 12px 12px;
  }
  h1 {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--steel);
    margin: 0 0 6px;
  }
  .hint {
    font-size: 0.78rem;
    color: var(--steel);
    margin: 0 0 10px;
  }
  .stage {
    position: relative;
    margin: 0 0 6px;
  }
  .logos {
    position: relative;
    height: 108px;
    margin: 0 var(--edge-pad);
  }
  .logos.top { margin-bottom: 4px; }
  .logos.bottom { margin-top: 4px; }
  .logo-marker {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    width: var(--marker-w);
    text-align: center;
    opacity: 0.22;
    filter: grayscale(1);
    transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
  }
  .logo-marker.active {
    opacity: 1;
    filter: none;
  }
  .logos.top .logo-marker.active {
    transform: translateX(-50%) translateY(-2px);
  }
  .logos.bottom .logo-marker.active {
    transform: translateX(-50%) translateY(2px);
  }
  .logo-marker img,
  .logo-marker .ph {
    width: 52px;
    height: 52px;
    object-fit: contain;
    border: 1px solid var(--rule);
    background: #fff;
    display: block;
    margin: 0 auto 4px;
  }
  .logos.bottom .logo-marker {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
  }
  .logos.bottom .logo-marker img,
  .logos.bottom .logo-marker .ph {
    margin: 4px auto 0;
  }
  .logo-marker .ph {
    font-size: 0.58rem;
    color: var(--steel);
    display: grid;
    place-items: center;
    padding: 4px;
    line-height: 1.15;
  }
  .logo-marker .label {
    font-size: 0.62rem;
    color: var(--ink);
    line-height: 1.15;
    padding: 0 2px;
  }
  .track-wrap {
    padding: 0 var(--edge-pad);
    position: relative;
  }
  .track-line {
    position: absolute;
    left: var(--edge-pad);
    right: var(--edge-pad);
    top: 50%;
    height: 2px;
    background: var(--rule);
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 0;
  }
  .year-ends {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--steel);
    margin-top: 2px;
  }
  input[type="range"] {
    position: relative;
    z-index: 1;
    width: 100%;
    accent-color: var(--ember);
    height: 1.75rem;
    margin: 0;
  }
  .year-readout {
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
    margin-top: 0.1rem;
    color: var(--active);
  }
  .pending {
    margin-top: 0.55rem;
    font-size: 0.82rem;
    color: var(--steel);
  }
  .pending ul { margin: 0.25rem 0 0; padding-left: 1.2rem; }
  .empty {
    font-size: 0.9rem;
    color: var(--steel);
    margin: 0.5rem 0 1rem;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }
</style>
</head>
<body>
  <h1>Founding timeline</h1>
  <p class="hint">Logos for the same founding year sit above and below the track so they do not overlap.</p>
  <p id="status" class="empty" hidden></p>
  <div class="stage">
    <div class="logos top" id="logos-top" aria-label="Departments above the timeline"></div>
    <div class="track-wrap">
      <div class="track-line" aria-hidden="true"></div>
      <label class="sr-only" for="year-slider">Founding year</label>
      <input id="year-slider" type="range" min="1905" max="1928" value="1905" step="1" />
      <div class="year-ends" aria-hidden="true">
        <span>1905</span>
        <span>1928</span>
      </div>
      <div class="year-readout" id="year-readout" aria-live="polite">1905</div>
    </div>
    <div class="logos bottom" id="logos-bottom" aria-label="Departments below the timeline"></div>
  </div>
  <div class="pending" id="pending" hidden>
    <strong>Founding year pending</strong>
    <ul id="pending-list"></ul>
  </div>

<script>
const DATA_URL = new URL("../data/departments.json", window.location.href).href;

function parseYear(value) {
  if (value === null || value === undefined) return null;
  const s = String(value).trim();
  if (!s || s.toUpperCase() === "TODO") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

/** Assign top/bottom lanes so same-year logos do not stack (1st above, 2nd below). */
function assignLanes(known) {
  const sorted = [...known].sort((a, b) => {
    if (a.founded_year !== b.founded_year) return a.founded_year - b.founded_year;
    return String(a.short_name || a.name).localeCompare(String(b.short_name || b.name));
  });
  const yearSlot = new Map();
  return sorted.map((d) => {
    const slot = yearSlot.get(d.founded_year) || 0;
    yearSlot.set(d.founded_year, slot + 1);
    return { ...d, lane: slot % 2 === 0 ? "top" : "bottom" };
  });
}

function makeMarker(d, minY, maxY) {
  const left = ((d.founded_year - minY) / (maxY - minY)) * 100;
  const el = document.createElement("div");
  el.className = "logo-marker";
  el.style.left = `${left}%`;
  el.dataset.year = String(d.founded_year);
  el.title = `${d.name} (${d.founded_year})`;
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", `${d.name}, founded ${d.founded_year}`);

  const imgPath = new URL("../" + d.logo_path.replace(/^\/+/, ""), window.location.href).href;
  const img = document.createElement("img");
  img.alt = `${d.name} logo`;
  img.src = imgPath;
  img.addEventListener("error", () => {
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = d.short_name || d.name;
    img.replaceWith(ph);
  });

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = `${d.short_name || d.name}\n${d.founded_year}`;
  label.style.whiteSpace = "pre-line";

  el.appendChild(img);
  el.appendChild(label);
  return el;
}

async function main() {
  const status = document.getElementById("status");
  const logosTop = document.getElementById("logos-top");
  const logosBottom = document.getElementById("logos-bottom");
  const slider = document.getElementById("year-slider");
  const readout = document.getElementById("year-readout");
  const pending = document.getElementById("pending");
  const pendingList = document.getElementById("pending-list");

  let depts = [];
  try {
    const resp = await fetch(DATA_URL);
    depts = await resp.json();
  } catch (err) {
    status.hidden = false;
    status.textContent = "Could not load department data.";
    return;
  }

  const known = [];
  const unknown = [];
  for (const d of depts) {
    const year = parseYear(d.founded_year);
    if (year === null) unknown.push(d);
    else known.push({ ...d, founded_year: year });
  }

  if (unknown.length) {
    pending.hidden = false;
    pendingList.innerHTML = unknown.map(d =>
      `<li>${d.name} — founding year pending</li>`
    ).join("");
  }

  if (!known.length) {
    status.hidden = false;
    status.textContent = "No founded years are available yet. Add numeric founded_year values in data/departments.json to activate the timeline.";
    slider.disabled = true;
    return;
  }

  // Fixed scale matching the earliest/latest known founding years.
  const minY = 1905;
  const maxY = 1928;
  slider.min = String(minY);
  slider.max = String(maxY);
  slider.value = String(minY);
  readout.textContent = String(minY);

  const placed = assignLanes(known);
  placed.forEach(d => {
    const el = makeMarker(d, minY, maxY);
    (d.lane === "bottom" ? logosBottom : logosTop).appendChild(el);
  });

  function render() {
    const y = Number(slider.value);
    readout.textContent = String(y);
    document.querySelectorAll(".logo-marker").forEach(el => {
      const fy = Number(el.dataset.year);
      el.classList.toggle("active", y >= fy);
    });
  }

  slider.addEventListener("input", render);
  slider.addEventListener("change", render);
  render();
}

main();
</script>
</body>
</html>
